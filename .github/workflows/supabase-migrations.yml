name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending migrations via psql
        run: |
          set -e
          applied="$(psql "$SUPABASE_DB_URL" -Atqc "SELECT version FROM supabase_migrations.schema_migrations;")"
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            version="${base%%_*}"
            if echo "$applied" | grep -qx "$version"; then
              echo "Skipping already-applied $base"
              continue
            fi
            echo "Applying $base"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c \
              "INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${version}', '${base}') ON CONFLICT DO NOTHING;"
          done
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
