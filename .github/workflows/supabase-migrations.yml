name: Deploy Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref jamjnxmsaeqtwkkokrms
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Debug DB URL shape (no secrets leaked)
        run: |
          echo "Length: ${#SUPABASE_DB_URL}"
          echo "Prefix (first 14 chars): ${SUPABASE_DB_URL:0:14}"
          echo "Contains '@': $(echo "$SUPABASE_DB_URL" | grep -c '@' || true)"
          echo "Host part after last @: $(echo "$SUPABASE_DB_URL" | sed -E 's/.*@//; s#/.*##')"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Push pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
